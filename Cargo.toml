[package]
name = "walrus-meter"
version = "0.1.0"
edition = "2024"
authors = ["Linera <contact@linera.io>"]
license = "Apache-2.0"
description = "Instrumentation-based gas metering built on `walrus`"
homepage = "https://github.com/linera-io/walrus-meter"
repository = "https://github.com/linera-io/walrus-meter"
documentation = "https://docs.rs/walrus-meter/"

[dependencies]
anyhow = "1.0.102"
walrus = "0.26.1"

[dev-dependencies]
test-case = "3.3.1"
wasm-instrument = { version = "0.4.0", features = ["sign_ext"] }
wasmtime = "44"
wat = "1.248.0"
